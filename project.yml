name: MusicTrad
options:
  bundleIdPrefix: fr.dynamicagence
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
targets:
  MusicTrad:
    type: application
    platform: macOS
    sources:
      - path: MusicTrad
    info:
      path: MusicTrad/Info.plist
      properties:
        CFBundleDisplayName: MusicTrad
        CFBundleShortVersionString: "2.0.6"
        CFBundleVersion: "20"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.music
        NSAppleEventsUsageDescription: "MusicTrad lit le titre et la position de lecture dans Musique pour afficher et traduire les paroles."
    scheme:
      testTargets:
        - MusicTradTests
    entitlements:
      path: MusicTrad/MusicTrad.entitlements
      properties:
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.dynamicagence.MusicTrad
        PRODUCT_NAME: MusicTrad
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Tests des parties pures (sans lancer l'app) : les fichiers testés sont compilés dans le bundle.
  MusicTradTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MusicTradTests
      - path: MusicTrad/Lyrics/LRCParser.swift
      - path: MusicTrad/Lyrics/LyricsModels.swift
      - path: MusicTrad/Storage/CachePruning.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.dynamicagence.MusicTradTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
